# Packages the app for Linux (AppImage), Windows (zip of a windeployqt folder) and
# macOS (dmg) whenever a version tag is pushed, then publishes all three on a GitHub
# Release named after the tag.
#
#   git tag v1.2.0
#   git push --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.6.3
  # The built-in Spotify player (see src/core/SpotifyEngine.hpp), pinned and checked
  # against the digests GitHub publishes for that release. Bump all three together.
  GO_LIBRESPOT_VERSION: v0.10.1
  GO_LIBRESPOT_SHA256_LINUX: bb504af82501eef8d50a1fe329d6998294e741a765aa0ececb1cfb7e75379310
  GO_LIBRESPOT_SHA256_WINDOWS: e507c499d89ed5738dc585850f6916520d73a3d7f639f89761842a31e769039b

# vars.SPOTIFY_CLIENT_ID (Settings -> Secrets and variables -> Actions -> Variables) is the
# Spotify app the release signs in as. A Client ID is public by design; leaving the variable
# unset just means users enter their own in the app.

jobs:
  linux:
    name: Linux AppImage
    # The oldest supported runner on purpose: an AppImage carries Qt but not glibc, so
    # building on old glibc is what lets it run on old distributions.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: gcc_64
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev libxcb-cursor0 imagemagick

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMODORO_VERSION=${{ github.ref_name }} -DPOMODORO_SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }} -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Stage AppDir
        run: DESTDIR="$PWD/AppDir" cmake --install build

      # Beside the executable, where SpotifyEngine looks. Its decoders are built in; it
      # needs only ALSA, which every desktop has and AppImages leave to the system.
      - name: Bundle the Spotify player
        run: |
          curl -sSL -o go-librespot.tar.gz "https://github.com/devgianlu/go-librespot/releases/download/${GO_LIBRESPOT_VERSION}/go-librespot_linux_x86_64.tar.gz"
          echo "${GO_LIBRESPOT_SHA256_LINUX}  go-librespot.tar.gz" | sha256sum -c -
          mkdir -p AppDir/usr/bin/spotify
          tar -xzf go-librespot.tar.gz -C AppDir/usr/bin/spotify go-librespot
          chmod +x AppDir/usr/bin/spotify/go-librespot

      - name: Build AppImage
        env:
          # The tools are AppImages themselves; this runs them without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Lets the Qt plugin see the QML imports the app actually uses.
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/ui
          OUTPUT: pomodoro-${{ github.ref_name }}-x86_64.AppImage
        run: |
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # hicolor wants a standard size; the 500x500 source is scaled down for it.
          convert assets/icons/pomodoroLogoTransport.png -resize 256x256 pomodoro.png

          ./linuxdeploy --appdir AppDir \
            --desktop-file packaging/pomodoro.desktop \
            --icon-file pomodoro.png \
            --plugin qt \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: pomodoro-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022

    # Evaluated once here because a step cannot read its own env block from its `if`,
    # and `secrets` is not available in an `if` expression at all.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMODORO_VERSION=${{ github.ref_name }} -DPOMODORO_SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }}
          cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pomodoro | Out-Null
          Copy-Item build/pomodoro.exe dist/pomodoro/
          windeployqt --release --no-translations --qmldir src/ui dist/pomodoro/pomodoro.exe

          # The FFmpeg multimedia backend needs these next to the exe. Newer windeployqt
          # copies them itself; older ones do not, and copying twice is harmless.
          Get-ChildItem "$env:QT_ROOT_DIR/bin" -Include av*.dll, sw*.dll -Recurse |
            Copy-Item -Destination dist/pomodoro/ -Force

      # The Windows build of go-librespot ships without the decoding libraries it links
      # against; MSYS2's MINGW64 packages are the matching builds (it uses msvcrt).
      - name: Install the Spotify player's libraries
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-flac mingw-w64-x86_64-libvorbis mingw-w64-x86_64-mpg123

      # In spotify\ of its own, beside the exe: those libraries share file names with
      # ones Qt's FFmpeg brings, built for another C runtime.
      - name: Bundle the Spotify player
        shell: pwsh
        run: |
          $url = "https://github.com/devgianlu/go-librespot/releases/download/$env:GO_LIBRESPOT_VERSION/go-librespot_windows_amd64.tar.gz"
          Invoke-WebRequest $url -OutFile go-librespot.tar.gz

          if ((Get-FileHash go-librespot.tar.gz -Algorithm SHA256).Hash -ne $env:GO_LIBRESPOT_SHA256_WINDOWS) {
            throw "go-librespot does not match its published checksum"
          }

          New-Item -ItemType Directory -Force dist/pomodoro/spotify | Out-Null
          tar -xzf go-librespot.tar.gz -C dist/pomodoro/spotify go-librespot.exe

          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64/bin"
          foreach ($dll in 'libFLAC.dll', 'libmpg123-0.dll', 'libogg-0.dll', 'libvorbis-0.dll', 'libvorbisenc-2.dll', 'libwinpthread-1.dll') {
            Copy-Item (Join-Path $bin $dll) dist/pomodoro/spotify/
          }

          # A missing library would only show on a user's machine as "DLL not found"
          # (0xC0000135). Starting it once here turns that into a failed build.
          & dist/pomodoro/spotify/go-librespot.exe --this-flag-does-not-exist 2>$null
          if ($LASTEXITCODE -eq -1073741515) { throw "go-librespot is missing a DLL" }
          $global:LASTEXITCODE = 0

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/pomodoro -DestinationPath "pomodoro-${{ github.ref_name }}-windows-x64.zip"

      # Signing is what stops SmartScreen calling the app an unrecognised program from an
      # unknown publisher. It only runs once a certificate is configured; without the
      # secrets the step is skipped and the build is simply unsigned, exactly as before.
      - name: Sign the executable
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT))
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/pomodoro/pomodoro.exe
          Remove-Item cert.pfx

      # A per-user installer: no administrator, installs under %LOCALAPPDATA%\Programs,
      # and registers the Start menu entry with the AppUserModelID the app expects.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

          $version = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc `
            "/DAppVersion=$version" "/DSourceDir=$(Resolve-Path dist/pomodoro)" `
            packaging/windows/pomodoro.iss

          # Moved up beside the zip, under the same v-prefixed name the other platforms
          # use. upload-artifact keeps every path relative to the common ancestor of what
          # it matches, so an installer left in dist/ arrives one directory deep and the
          # publish job's glob walks straight past it.
          Move-Item "dist/pomodoro-$version-windows-x64-setup.exe" `
            "pomodoro-${{ github.ref_name }}-windows-x64-setup.exe"

      - name: Sign the installer
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT))
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem pomodoro-*setup.exe)
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            pomodoro-*.zip
            pomodoro-*setup.exe
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # The bundle icon. Only macOS has iconutil, so the .icns is made here rather than
      # committed; CMakeLists.txt picks it up when it exists.
      - name: Generate app icon
        run: |
          mkdir pomodoro.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icons/pomodoroLogoTransport.png --out pomodoro.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icons/pomodoroLogoTransport.png --out pomodoro.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns pomodoro.iconset -o assets/icons/pomodoro.icns

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOMODORO_VERSION=${{ github.ref_name }} -DPOMODORO_SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }}
          cmake --build build --parallel

      - name: Deploy Qt runtime and build dmg
        run: |
          macdeployqt build/pomodoro.app -qmldir=src/ui

          # macdeployqt's own -dmg makes a bare disk image with the bundle loose inside it,
          # which leaves people dragging the app to the desktop. Staging it next to a
          # symlink to /Applications gives the familiar drag-to-install window, and puts
          # the app somewhere Spotlight and Launchpad actually index.
          mkdir -p staging
          cp -R build/pomodoro.app staging/Pomodoro.app
          ln -s /Applications staging/Applications

          hdiutil create -volname "Pomodoro" -srcfolder staging -ov -format UDZO             "pomodoro-${{ github.ref_name }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: pomodoro-*.dmg
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: pomodoro ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/pomodoro-*.AppImage
            artifacts/pomodoro-*setup.exe
            artifacts/pomodoro-*.zip
            artifacts/pomodoro-*.dmg
